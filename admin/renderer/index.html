<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SU8L DEVs — Admin Panel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Login -->
  <div id="login" class="login-wrap hidden">
    <div class="login-card">
      <div class="login-head">
        <img class="logo-img" src="logo.png" alt="SU8L DEVs" />
        <button id="loginLangBtn" class="lang-btn" title="العربية / English">ع / EN</button>
      </div>
      <h1>SU8L DEVs</h1>
      <p class="sub" data-i18n="loginSub">Admin Panel · لوحة التحكم</p>
      <label data-i18n="loginBaseLabel">رابط السيرفر (API)</label>
      <input id="loginBase" class="input" placeholder="https://su8ldevs.eu.cc/api/panel" dir="ltr" />
      <label data-i18n="loginKeyLabel">مفتاح الأدمن</label>
      <input id="loginKey" class="input" type="password" placeholder="Admin Key" dir="ltr" />
      <button id="loginBtn" class="btn primary btn-block" data-i18n="loginBtn">دخول · Login</button>
      <div id="loginErr" class="err hidden"></div>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app hidden">
    <aside class="side">
      <div class="side-brand">
        <img class="logo-img small" src="logo.png" alt="SU8L DEVs" />
        <div>
          <div class="brand-name">SU8L DEVs</div>
          <div class="brand-sub" data-i18n="brandSub">Admin Panel</div>
        </div>
      </div>
      <nav class="side-nav">
        <button class="nav-item active" data-view="overview"><span>◉</span> <span data-i18n="nav.overview">نظرة عامة</span> <small>Overview</small></button>
        <button class="nav-item" data-view="users"><span>▤</span> <span data-i18n="nav.users">المستخدمون</span> <small>Users</small></button>
        <button class="nav-item" data-view="orders"><span>◈</span> <span data-i18n="nav.orders">الطلبات</span> <small>Orders</small></button>
        <button class="nav-item" data-view="tickets"><span>▥</span> <span data-i18n="nav.tickets">التذاكر</span> <small>Tickets</small></button>
        <button class="nav-item" data-view="promos"><span>⌬</span> <span data-i18n="nav.promos">أكواد الخصم</span> <small>Promos</small></button>
        <button class="nav-item" data-view="configs"><span>⬢</span> <span data-i18n="nav.configs">اختيارات العملاء</span> <small>Configs</small></button>
      </nav>
      <div class="side-foot">
        <span id="connStatus" class="conn off" data-i18n="connOff">غير متصل</span>
        <button id="langBtn" class="btn ghost small" title="العربية / English">ع / EN</button>
        <button id="logoutBtn" class="btn ghost small" data-i18n="logout">خروج · Logout</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <h2 id="viewTitle">نظرة عامة</h2>
        <div class="row">
          <div class="notif-wrap">
            <button id="notifBtn" class="btn ghost small notif-btn" title="🔔">🔔<span id="notifBadge" class="notif-badge"></span></button>
            <div id="notifPanel" class="notif-panel hidden"></div>
          </div>
          <button id="refreshBtn" class="btn ghost small">⟳ <span data-i18n="refresh">تحديث</span></button>
        </div>
      </div>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
