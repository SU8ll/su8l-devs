services:
  # ── Local Development PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: su8l-pg-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: su8l_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ── Production Bot (Render handles the server) ────────────────────────────────
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: su8l-bot
    restart: always
    env_file:
      - bot/.env
    ports:
      - "4001:4001"

volumes:
  pgdata:
